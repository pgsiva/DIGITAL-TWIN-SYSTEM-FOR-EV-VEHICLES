<polyline points="180,105 420,105" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<rect x="420" y="80" width="150" height="60" rx="10" fill="#1a73e8" stroke="#0d1b2a" stroke-width="1.5"/>
<text x="495.0" y="106.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">INA219</text>
<text x="495.0" y="124.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Current Sensor</text>
<polyline points="570,105 640,105" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<rect x="640" y="80" width="150" height="60" rx="10" fill="#546e7a" stroke="#0d1b2a" stroke-width="1.5"/>
<text x="715.0" y="106.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Load / Motor</text>
<text x="715.0" y="124.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Controller</text>
<rect x="760" y="260" width="200" height="90" rx="10" fill="#0f9d58" stroke="#0d1b2a" stroke-width="1.5"/>
<text x="860.0" y="301.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">ESP32</text>
<text x="860.0" y="319.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Dev Board</text>
<text x="860.0" y="342" font-family="Segoe UI, Arial" font-size="10.5" fill="#ffffff" opacity="0.85" text-anchor="middle">GPIO21=SDA  GPIO22=SCL</text>
