<text x="505.0" y="526.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">MCP9808</text>
<text x="505.0" y="544.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">Temp Sensor</text>
