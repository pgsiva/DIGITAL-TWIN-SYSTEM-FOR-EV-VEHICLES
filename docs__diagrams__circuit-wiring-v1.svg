<polyline points="495,140 495,400" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<text x="560" y="270" font-size="11" fill="#cfd8e3" text-anchor="middle">A0 sense line</text>
<polyline points="495,400 260,400" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<polyline points="260,400 239,340" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<polyline points="495,460 495,500" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<polyline points="495,80 495,60" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<polyline points="495,60 760,60" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<polyline points="760,60 760,260" fill="none" stroke="#8fa3bf" stroke-width="2"/>
<text x="600" y="52" font-size="11" fill="#cfd8e3">I2C (0x40)</text>
<text x="20" y="640" font-size="12" font-weight="600" fill="#ffffff">Notes:</text>
<text x="20" y="660" font-size="11.5" fill="#b8c2d1">- All sensors share one I2C bus (SDA=GPIO21, SCL=GPIO22) at different addresses.</text>
<text x="20" y="676" font-size="11.5" fill="#b8c2d1">- Add a 100nF cap across R-bottom and an optional 5.1V zener (A0 to GND) for ADC protection.</text>
<text x="20" y="692" font-size="11.5" fill="#b8c2d1">- INA219 max bus voltage is ~26V - only valid for the 12V single-pack prototype.</text>
</svg>