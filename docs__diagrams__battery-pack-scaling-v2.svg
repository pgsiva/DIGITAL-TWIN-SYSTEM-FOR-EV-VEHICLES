<text x="525.0" y="574.25" font-family="Segoe UI, Arial" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">+ ACS758 pack current sensor</text>
<text x="20" y="570" font-size="11" fill="#b8c2d1">- Version-2 (44.4V) pack: INA219 cannot be used above ~26V bus - use ACS758 or INA226 with isolation for pack current.</text>
<text x="20" y="586" font-size="11" fill="#b8c2d1">- MOSFET gate driven by ESP32 GPIO (via gate resistor) to disconnect a faulty sub-pack from the series chain.</text>
<text x="20" y="602" font-size="11" fill="#b8c2d1">- Each divider uses 220k/22k (10:1) for a 0-60V safe input range into the ADS1115 (GAIN_TWOTHIRDS, 0-6.144V).</text>
